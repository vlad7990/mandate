<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container": "#1d1f27",
                    "surface-container-highest": "#32343d",
                    "on-tertiary": "#233144",
                    "surface-container-lowest": "#0c0e16",
                    "background": "#11131b",
                    "inverse-on-surface": "#2e3039",
                    "on-primary-fixed": "#00174b",
                    "secondary": "#bec6e0",
                    "on-secondary": "#283044",
                    "secondary-fixed-dim": "#bec6e0",
                    "primary-fixed": "#dbe1ff",
                    "secondary-fixed": "#dae2fd",
                    "on-tertiary-container": "#eaf0ff",
                    "primary-fixed-dim": "#b4c5ff",
                    "tertiary": "#b9c7e0",
                    "on-primary-fixed-variant": "#003ea8",
                    "on-tertiary-fixed": "#0d1c2f",
                    "surface": "#11131b",
                    "outline": "#8d90a0",
                    "on-tertiary-fixed-variant": "#3a485c",
                    "on-primary-container": "#eeefff",
                    "on-secondary-fixed-variant": "#3f465c",
                    "inverse-primary": "#0053db",
                    "tertiary-fixed-dim": "#b9c7e0",
                    "on-background": "#e1e2ed",
                    "on-error-container": "#ffdad6",
                    "on-secondary-fixed": "#131b2e",
                    "outline-variant": "#434655",
                    "surface-container-low": "#191b23",
                    "primary-container": "#2563eb",
                    "primary": "#b4c5ff",
                    "surface-dim": "#11131b",
                    "surface-tint": "#b4c5ff",
                    "on-primary": "#002a78",
                    "surface-container-high": "#282a32",
                    "on-surface": "#e1e2ed",
                    "error-container": "#93000a",
                    "on-secondary-container": "#adb4ce",
                    "on-surface-variant": "#c3c6d7",
                    "error": "#ffb4ab",
                    "tertiary-container": "#606e84",
                    "on-error": "#690005",
                    "surface-variant": "#32343d",
                    "tertiary-fixed": "#d5e3fd",
                    "surface-bright": "#373942",
                    "inverse-surface": "#e1e2ed",
                    "secondary-container": "#3f465c"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "tight": "8px",
                    "gutter": "16px",
                    "unit": "4px",
                    "container-padding": "24px",
                    "loose": "32px"
            },
            "fontFamily": {
                    "h2": ["Inter"],
                    "mono-label": ["Space Grotesk"],
                    "h1": ["Inter"],
                    "body-main": ["Inter"],
                    "data-point": ["Space Grotesk"]
            },
            "fontSize": {
                    "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "mono-label": ["11px", {"lineHeight": "1", "fontWeight": "600"}],
                    "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-main": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "data-point": ["14px", {"lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .neural-bg {
            background-image: radial-gradient(circle at 2px 2px, rgba(37, 99, 235, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }
        .glass-panel {
            backdrop-filter: blur(8px);
            background: rgba(17, 19, 27, 0.8);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-main selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<div class="fixed inset-0 neural-bg opacity-40 z-0" data-alt="abstract neural network visualization with faint blue connected nodes and geometric grid lines on a deep dark background"></div>
<div class="fixed inset-0 bg-gradient-to-tr from-surface-container-lowest via-background to-surface-container-low opacity-90 z-0"></div>
<nav class="fixed top-0 left-0 w-full flex justify-between items-center h-12 px-6 bg-transparent z-50">
<div class="text-lg font-bold tracking-tighter text-on-surface uppercase font-h1">
            Mandate
        </div>
<div class="flex items-center gap-4">
<div class="flex items-center bg-surface-container-high border border-outline-variant p-1 rounded">
<button class="p-1 px-2 text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[18px]">light_mode</span>
</button>
<button class="p-1 px-2 text-primary bg-surface-container-highest border border-outline-variant rounded transition-colors shadow-sm">
<span class="material-symbols-outlined text-[18px]">dark_mode</span>
</button>
<button class="p-1 px-2 text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[18px]">hdr_auto</span>
</button>
</div>
</div>
</nav>
<main class="z-10 w-full max-w-[420px] px-6">
<div class="bg-surface-container-low border border-outline-variant rounded shadow-2xl p-8 relative">
<div class="absolute -top-px left-0 w-full h-px bg-gradient-to-r from-transparent via-primary to-transparent opacity-50"></div>
<header class="mb-8">
<h1 class="font-h2 text-h2 text-on-surface mb-2">Access Intelligence</h1>
<p class="text-on-surface-variant font-body-main">Secure gateway to Mandate Neural Analytics.</p>
</header>
<form class="space-y-6">
<div class="space-y-2">
<label class="font-mono-label text-mono-label uppercase text-on-surface-variant tracking-wider">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">alternate_email</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-3 pl-10 text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none placeholder:text-surface-container-highest" placeholder="name@enterprise.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-mono-label text-mono-label uppercase text-on-surface-variant tracking-wider">Password</label>
<a class="font-mono-label text-mono-label text-primary hover:underline decoration-primary-container underline-offset-4" href="#">Forgot Security Key?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-3 pl-10 text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none placeholder:text-surface-container-highest" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-h2 text-body-main py-3 rounded hover:bg-opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-2 group" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-outline-variant opacity-30"></span>
</div>
<div class="relative flex justify-center text-mono-label uppercase font-mono-label text-on-surface-variant bg-surface-container-low px-4">
                    Enterprise Protocol
                </div>
</div>
<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-main py-3 rounded hover:bg-surface-container-high transition-colors flex justify-center items-center gap-2 group" type="button">
<span class="material-symbols-outlined text-primary text-[20px]">hub</span>
                Continue with Enterprise SSO
            </button>
<footer class="mt-8 text-center">
<p class="text-on-surface-variant text-mono-label uppercase font-mono-label">
                    Authorized Personnel Only
                </p>
<div class="mt-4 flex justify-center gap-4 text-mono-label font-mono-label text-on-surface-variant opacity-60">
<a class="hover:text-primary transition-colors" href="#">Privacy</a>
<a class="hover:text-primary transition-colors" href="#">Security</a>
<a class="hover:text-primary transition-colors" href="#">Terms</a>
</div>
</footer>
</div>
</main>
<footer class="fixed bottom-0 w-full flex justify-between items-center py-4 px-8 bg-transparent">
<span class="font-mono-label text-mono-label uppercase tracking-widest text-on-surface-variant opacity-50">
            © 2024 Mandate Intelligence. All rights reserved.
        </span>
<div class="flex items-center gap-4 text-mono-label text-on-surface-variant font-mono-label uppercase tracking-widest">
<span class="flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                Node Status: Active
            </span>
<span class="opacity-30">|</span>
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]">terminal</span>
                V2.4.0-STABLE
            </span>
</div>
</footer>
<div class="fixed top-1/2 left-4 -translate-y-1/2 space-y-4 opacity-10 pointer-events-none hidden lg:block">
<div class="w-16 h-[2px] bg-primary"></div>
<div class="w-24 h-[2px] bg-primary"></div>
<div class="w-12 h-[2px] bg-primary"></div>
</div>
<div class="fixed top-1/2 right-4 -translate-y-1/2 space-y-4 opacity-10 pointer-events-none hidden lg:block text-right">
<div class="w-16 h-[2px] bg-primary ml-auto"></div>
<div class="w-24 h-[2px] bg-primary ml-auto"></div>
<div class="w-12 h-[2px] bg-primary ml-auto"></div>
</div>
</body></html>
